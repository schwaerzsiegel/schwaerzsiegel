[package]
name = "schwaerzsiegel"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
# Kleinere, gehärtete Release-Builds
panic = "abort"
strip = true
lto = true
